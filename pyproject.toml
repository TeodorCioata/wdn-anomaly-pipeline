[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wdn-anomaly-pipeline"
version = "0.1.0"
description = "Simulation pipeline for anomalous time-series data in water distribution networks"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Teodor Cioata", email = "t.cioata@student.rug.nl" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "wntr>=1.2.0",
    # NumPy 2.4 wheels are built with X86_V2 baseline optimizations that
    # crash at import on CPUs without the X86_V2 microarchitecture level.
    # Cap below 2.4 so a fresh install runs on older hardware.
    "numpy>=1.26,<2.4",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.8.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "duckdb>=0.10.0",
    "typer>=0.12.0",
    # The custom Typer command group subclasses click's Group. typer 0.26
    # no longer declares click as a dependency, so it is pinned explicitly
    # to guarantee it is importable.
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]
# Optional ML loader (wdn_pipeline.ml). PyTorch is heavy and only needed
# for WDNWindowDataset; scenario_train_test_split works without it.
ml = [
    "torch>=2.0",
]

[project.scripts]
wdn-pipeline = "wdn_pipeline.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src"]
# wntr, duckdb and pyarrow ship without type stubs; their imports are
# treated as untyped rather than failing the run.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
