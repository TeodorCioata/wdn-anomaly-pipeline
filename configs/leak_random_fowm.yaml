# Fully random leak parameters on FOWM, demonstrating reproducibility
# under the scenario seed. Pipe and split fraction are drawn from the
# RNG; running this config twice with the same seed produces identical
# resolved leak parameters and bit-equivalent output (up to the
# documented WNTR Newton-solver noise floor).

network:
  inp_path: networks/FOWM.inp
  name: fowm

simulation:
  duration_seconds: 86400
  hydraulic_timestep_seconds: 3600
  report_timestep_seconds: 3600
  pattern_timestep_seconds: 3600
  demand_model: PDD

seed: 99

demand:
  mode: fourier
  fourier:
    base: 1.0
    amplitude: 0.3
    period_hours: 24.0
    phase_shift_hours: 6.0
    noise_std: 0.0

scenario:
  type: leak
  label: leak_random

faults:
  leaks:
    - area_m2: 0.003
      discharge_coeff: 0.75
      start_time_seconds: 14400    # 04:00
      end_time_seconds: 64800      # 18:00
      profile: abrupt
      name: random_abrupt_leak

output:
  directory: outputs
  formats: [parquet, csv]
  write_metadata_sidecar: true
