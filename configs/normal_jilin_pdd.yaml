# Normal scenario on Jilin under PDD (24h, 1h timestep).
# Jilin.inp ships with one demand pattern, so the default demand
# strategy keeps the .inp pattern. PDD is the project default from
# Week 5 onwards.

network:
  inp_path: networks/Jilin.inp
  name: jilin

simulation:
  duration_seconds: 86400          # 24 hours
  hydraulic_timestep_seconds: 3600 # 1 hour
  report_timestep_seconds: 3600
  pattern_timestep_seconds: 3600
  demand_model: PDD

seed: 23

demand:
  mode: default

scenario:
  type: normal
  label: normal_pdd

output:
  directory: outputs
  formats: [parquet, csv]
  write_metadata_sidecar: true
