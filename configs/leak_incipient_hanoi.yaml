# Single incipient (linear-profile) leak on Hanoi.
# Hanoi.inp has no demand patterns and duration=0, so we drive demand
# with the synthetic Fourier pattern. The leak ramps up over the first
# 8 hours of simulation across 30 step controls.

network:
  inp_path: networks/Hanoi.inp
  name: hanoi

simulation:
  duration_seconds: 86400
  hydraulic_timestep_seconds: 3600
  report_timestep_seconds: 3600
  pattern_timestep_seconds: 3600
  demand_model: PDD

seed: 7

demand:
  mode: fourier
  fourier:
    base: 1.0
    amplitude: 0.3
    period_hours: 24.0
    phase_shift_hours: 6.0
    noise_std: 0.0

scenario:
  type: leak
  label: leak_incipient

faults:
  leaks:
    - pipe: "5"
      split_fraction: 0.4
      diameter_m: 0.06            # ~60 mm hole, area ~ 0.00283 m^2
      discharge_coeff: 0.75
      start_time_seconds: 14400   # 04:00, leaves 4h baseline
      end_time_seconds: 50400     # 14:00, 10h ramp window
      profile: linear
      profile_steps: 30
      name: morning_growing_leak

output:
  directory: outputs
  formats: [parquet, csv]
  write_metadata_sidecar: true
