# Cumulative scenario on Net3: an abrupt pipe leak plus a sensor gain
# fault. Exercises the Week 5 gain fault type in a cumulative setting.
# The leak modifies the hydraulic model; the gain multiplies junction
# "15"'s reported pressure by 1.10 post-simulation.

network:
  inp_path: Net3
  name: net3

simulation:
  duration_seconds: 86400          # 24 hours
  hydraulic_timestep_seconds: 3600 # 1 hour
  report_timestep_seconds: 3600
  demand_model: PDD

seed: 42

demand:
  mode: default

scenario:
  type: cumulative
  label: cumulative_leak_gain

faults:
  leaks:
    - pipe: "40"
      split_fraction: 0.5
      area_m2: 0.005
      discharge_coeff: 0.75
      start_time_seconds: 21600   # 06:00
      end_time_seconds: 64800     # 18:00
      profile: abrupt
      name: midday_central_leak
  sensor_faults:
    - type: gain
      quantity: pressure
      target: "15"
      gain_factor: 1.10        # +10% multiplicative gain
      start_time_seconds: 21600   # 06:00
      end_time_seconds: 64800     # 18:00
      name: midday_gain_node_15

# The leak amplifies the known Net3 node "10" dip; widen the warning
# floor so this stays a warning rather than a hard failure.
validation:
  pressure_min_warning_tolerance_m: 2.0

output:
  directory: outputs
  formats: [parquet, csv]
  write_metadata_sidecar: true
