# Single abrupt leak on Net3.
# Pipe '40' is in the central distribution loop and shows a clean
# pressure drop at its midpoint when leaked. PDD is required for any
# leak scenario (config validator enforces this).

network:
  inp_path: Net3
  name: net3

simulation:
  duration_seconds: 86400          # 24 hours
  hydraulic_timestep_seconds: 3600 # 1 hour
  report_timestep_seconds: 3600
  demand_model: PDD

seed: 42

demand:
  mode: default

scenario:
  type: leak
  label: leak_abrupt

faults:
  leaks:
    - pipe: "40"
      split_fraction: 0.5
      area_m2: 0.005           # ~80 mm equivalent diameter
      discharge_coeff: 0.75
      start_time_seconds: 21600   # 06:00
      end_time_seconds: 64800     # 18:00
      profile: abrupt
      name: midday_central_leak

# Net3's known node "10" pressure dip (~-0.66 m baseline) is amplified
# to ~-1.5 m once a leak draws extra flow under PDD. Bumping the warning
# tolerance keeps this as a warning rather than a hard failure; this is
# a property of the .inp, not of the leak.
validation:
  pressure_min_warning_tolerance_m: 2.0

output:
  directory: outputs
  formats: [parquet, csv]
  write_metadata_sidecar: true
