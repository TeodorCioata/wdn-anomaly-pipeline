# Normal scenario on Net3 (24h, 1h timestep).
# Net3 ships with WNTR; loaded by name from its built-in network library.

network:
  inp_path: Net3
  name: net3

simulation:
  duration_seconds: 86400          # 24 hours
  hydraulic_timestep_seconds: 3600 # 1 hour
  report_timestep_seconds: 3600
  demand_model: DDA

seed: 42

demand:
  mode: default

scenario:
  type: normal
  label: normal

output:
  directory: outputs
  formats: [parquet, csv]
  write_metadata_sidecar: true
