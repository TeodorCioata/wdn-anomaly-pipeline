# Cumulative scenario on Hanoi: an incipient (linear-profile) leak plus
# a drifting pressure sensor. Hanoi.inp has no demand patterns and
# duration=0, so demand is driven by the synthetic Fourier pattern.
# The leak ramps up over 10 hours; the drift sensor corrupts a separate
# junction over a 16-hour window.

network:
  inp_path: networks/Hanoi.inp
  name: hanoi

simulation:
  duration_seconds: 86400
  hydraulic_timestep_seconds: 3600
  report_timestep_seconds: 3600
  pattern_timestep_seconds: 3600
  demand_model: PDD

seed: 7

demand:
  mode: fourier
  fourier:
    base: 1.0
    amplitude: 0.3
    period_hours: 24.0
    phase_shift_hours: 6.0
    noise_std: 0.0

scenario:
  type: cumulative
  label: cumulative_leak_drift

faults:
  leaks:
    - pipe: "5"
      split_fraction: 0.4
      diameter_m: 0.06
      discharge_coeff: 0.75
      start_time_seconds: 14400   # 04:00
      end_time_seconds: 50400     # 14:00
      profile: linear
      profile_steps: 30
      name: morning_growing_leak
  sensor_faults:
    - type: drift
      quantity: pressure
      target: "20"
      slope_per_second: 0.0005  # m/s
      start_time_seconds: 14400   # 04:00
      end_time_seconds: 72000     # 20:00
      name: long_drift_node_20

# Drift sends the corrupted pressure above the strict upper bound;
# raise the upper limit so signal_applied is the gate, not the bounds.
validation:
  pressure_max_m: 250.0

output:
  directory: outputs
  formats: [parquet, csv]
  write_metadata_sidecar: true
