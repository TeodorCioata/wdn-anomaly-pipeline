# Two concurrent leaks on Jilin: one abrupt, one incipient (linear).
# Demonstrates D15 (multiple leaks per scenario) and shows that the
# label window covers the union of both leak time windows.

network:
  inp_path: networks/Jilin.inp
  name: jilin

simulation:
  duration_seconds: 86400
  hydraulic_timestep_seconds: 3600
  report_timestep_seconds: 3600
  pattern_timestep_seconds: 3600
  demand_model: PDD

seed: 23

demand:
  mode: default

scenario:
  type: leak
  label: leak_multi

faults:
  leaks:
    - pipe: "10"
      split_fraction: 0.5
      area_m2: 0.004
      discharge_coeff: 0.75
      start_time_seconds: 14400    # 04:00
      end_time_seconds: 43200      # 12:00
      profile: abrupt
      name: morning_abrupt_leak
    - pipe: "20"
      split_fraction: 0.6
      diameter_m: 0.05
      discharge_coeff: 0.75
      start_time_seconds: 28800    # 08:00
      end_time_seconds: 72000      # 20:00
      profile: linear
      profile_steps: 20
      name: midday_growing_leak

output:
  directory: outputs
  formats: [parquet, csv]
  write_metadata_sidecar: true
