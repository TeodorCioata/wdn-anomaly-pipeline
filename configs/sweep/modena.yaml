# Sweep config (Phase 5 Week 8, WP3) generated by scripts/generate_sweep_configs.py
# network: modena.inp | junctions=268 pipes=317 tanks=0 reservoirs=4
# demand mode 'fourier' chosen: has_patterns=False, inp_duration=0s
# seed=42 | 24h / 1h PDD | conservative validation tolerances (uncalibrated networks warn, never fail, on pressure)
network:
  inp_path: networks/modena.inp
  name: modena
simulation:
  duration_seconds: 86400
  hydraulic_timestep_seconds: 3600
  report_timestep_seconds: 3600
  demand_model: PDD
  pattern_timestep_seconds: 3600
seed: 42
demand:
  mode: fourier
scenario:
  type: normal
  label: normal
validation:
  pressure_min_m: 0.0
  pressure_min_warning_tolerance_m: 1000000.0
  pressure_max_m: 1000000.0
  mass_balance_tol_m3s: 0.001
output:
  directory: outputs/sweep
  formats:
  - parquet
  - csv
  write_metadata_sidecar: true
