# Cumulative scenario on Jilin: two concurrent leaks (one abrupt, one
# incipient) plus a dropout sensor fault. Exercises multiple leaks
# per scenario together with a post-simulation sensor fault. The
# per-timestep label is the union of both leak windows and the dropout
# outer window.

network:
  inp_path: networks/Jilin.inp
  name: jilin

simulation:
  duration_seconds: 86400
  hydraulic_timestep_seconds: 3600
  report_timestep_seconds: 3600
  pattern_timestep_seconds: 3600
  demand_model: PDD

seed: 23

demand:
  mode: default

scenario:
  type: cumulative
  label: cumulative_leak_dropout

faults:
  leaks:
    - pipe: "10"
      split_fraction: 0.5
      area_m2: 0.004
      discharge_coeff: 0.75
      start_time_seconds: 14400    # 04:00
      end_time_seconds: 43200      # 12:00
      profile: abrupt
      name: morning_abrupt_leak
    - pipe: "20"
      split_fraction: 0.6
      diameter_m: 0.05
      discharge_coeff: 0.75
      start_time_seconds: 28800    # 08:00
      end_time_seconds: 72000      # 20:00
      profile: linear
      profile_steps: 20
      name: midday_growing_leak
  sensor_faults:
    - type: dropout
      quantity: pressure
      target: "15"
      start_time_seconds: 14400    # 04:00
      end_time_seconds: 86400      # end of day
      intervals:
        - [14400, 21600]            # 04:00-06:00
        - [36000, 43200]            # 10:00-12:00
        - [64800, 72000]            # 18:00-20:00
      fill_value: null              # NaN
      name: triple_dropout_node_15

output:
  directory: outputs
  formats: [parquet, csv]
  write_metadata_sidecar: true
