# Single abrupt leak on Net3 with leak-node cleanup enabled.
# Identical to leak_abrupt_net3.yaml except output.remove_leak_nodes is
# true: the post-processing step reverts the leak-node split artefacts
# so the output tables carry the original Net3 column schema. The
# leak_demand diagnostic table is left untouched. Useful for ML
# consumers that need a consistent schema across normal and leak
# scenarios.

network:
  inp_path: Net3
  name: net3

simulation:
  duration_seconds: 86400          # 24 hours
  hydraulic_timestep_seconds: 3600 # 1 hour
  report_timestep_seconds: 3600
  demand_model: PDD

seed: 42

demand:
  mode: default

scenario:
  type: leak
  label: leak_abrupt_clean

faults:
  leaks:
    - pipe: "40"
      split_fraction: 0.5
      area_m2: 0.005
      discharge_coeff: 0.75
      start_time_seconds: 21600   # 06:00
      end_time_seconds: 64800     # 18:00
      profile: abrupt
      name: midday_central_leak

validation:
  pressure_min_warning_tolerance_m: 2.0

output:
  directory: outputs
  formats: [parquet, csv]
  write_metadata_sidecar: true
  remove_leak_nodes: true
